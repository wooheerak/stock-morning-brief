name: 모닝 증시 브리핑

on:
  schedule:
    # 매일 07:30 KST = 22:30 UTC (전날)
    - cron: "30 22 * * 0-4"  # 월~금 (주말 제외)
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: read
  secrets: write  # 카카오 토큰 자동 갱신을 위해 필요

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 모닝 브리핑 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python main.py

      - name: 카카오 토큰 Secrets 업데이트
        if: success()
        run: |
          CACHE="/tmp/kakao_new_tokens.env"
          if [ -f "$CACHE" ]; then
            while IFS='=' read -r key value; do
              [ -n "$key" ] && [ -n "$value" ] && echo "$value" | gh secret set "$key"
            done < "$CACHE"
            echo "카카오 토큰 GitHub Secrets 업데이트 완료"
          else
            echo "토큰 캐시 파일 없음 — 갱신 생략"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
