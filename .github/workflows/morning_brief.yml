name: 모닝 증시 브리핑

on:
  schedule:
    # 매일 07:30 KST = 22:30 UTC (전날)
    - cron: "30 22 * * 0-4"  # 월~금 (주말 제외)
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write   # 성과 로그 자동 커밋에 필요

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 커밋 히스토리 필요

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 모닝 브리핑 실행
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python main.py

      - name: 카카오 리프레시 토큰 GitHub Secret 자동 갱신
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # GH_PAT 미설정 시 건너뜀 (선택적 기능)
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "  [카카오] GH_PAT 미설정 — Secret 자동 갱신 건너뜀"
            echo "  (설정 방법: GitHub → Settings → Secrets → GH_PAT 추가, repo+secrets 권한)"
            exit 0
          fi
          CACHE_FILE=$(python3 -c "import tempfile; print(tempfile.gettempdir())")/kakao_new_tokens.env
          if [ ! -f "$CACHE_FILE" ]; then
            echo "  [카카오] 토큰 캐시 없음 (토큰 갱신 실패 또는 불필요)"
            exit 0
          fi
          # shellcheck disable=SC1090
          set -a; source "$CACHE_FILE"; set +a
          if [ -n "${KAKAO_REFRESH_TOKEN:-}" ]; then
            printf '%s' "$KAKAO_REFRESH_TOKEN" | gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "  [카카오] KAKAO_REFRESH_TOKEN GitHub Secret 자동 갱신 완료"
          else
            echo "  [카카오] 리프레시 토큰 미갱신 (유효기간 여유 있음)"
          fi

      - name: 성과 로그 자동 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance_log.json data/signals/ data/results/
          git diff --staged --quiet && echo "변경 없음" || \
            git commit -m "chore: 성과 데이터 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push || echo "push 불필요 (변경 없음)"
